[tools]
python = "3.14"
node = "lts"
"npm:@salesforce/cli" = "latest"

[tasks.install]
description = "Instalacja zależności Python"
run = "pip install -r requirements.txt"

[tasks.run]
description = "Uruchomienie pobierania załączników Salesforce (konfiguracja z .env)"
run = "python main.py"

[tasks.run-debug]
description = "Uruchomienie z debug output"
run = "python main.py --debug"
